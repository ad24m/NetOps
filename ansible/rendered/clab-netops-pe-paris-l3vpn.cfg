!
ip routing
!
router ospf 1
   router-id 10.255.0.21
!
interface Loopback0
   ip address 10.255.0.21/32
   ip ospf area 0.0.0.0
!
interface Ethernet1
   no switchport
   ip address 10.0.0.3/31
   ip ospf area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.0.0.9/31
   ip ospf area 0.0.0.0
!
mpls ip
!
mpls ldp
   router-id interface Loopback0
   no shutdown
!
vrf instance TENANT_1
ip routing vrf TENANT_1
!
vrf instance TENANT_2
ip routing vrf TENANT_2
!
interface Ethernet3
   no switchport
   vrf TENANT_1
   ip address 10.1.0.1/30
   no shutdown
!
interface Ethernet4
   no switchport
   vrf TENANT_2
   ip address 10.2.0.1/30
   no shutdown
!
router bgp 65000
   router-id 10.255.0.21
   neighbor 10.255.0.11 remote-as 65000
   neighbor 10.255.0.11 update-source Loopback0
   neighbor 10.255.0.11 send-community extended
   !
   address-family vpn-ipv4
      neighbor 10.255.0.11 activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vrf TENANT_1
      rd 65000:101
      route-target import vpn-ipv4 65000:1
      route-target export vpn-ipv4 65000:1
      neighbor 10.1.0.2 remote-as 65101
      !
      address-family ipv4
         neighbor 10.1.0.2 activate
      !
   vrf TENANT_2
      rd 65000:201
      route-target import vpn-ipv4 65000:2
      route-target export vpn-ipv4 65000:2
      neighbor 10.2.0.2 remote-as 65201
      !
      address-family ipv4
         neighbor 10.2.0.2 activate
      !
!
